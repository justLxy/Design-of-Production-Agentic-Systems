# OpenShell's example OpenAI provider profile (v0.1.4), with `binaries` changed to
# the interpreter in the vulnagent image, since the agent reaches the API through
# the OpenAI Python SDK and nothing else in the sandbox should. Import it with:
#   openshell provider profile import -f providers/openai.yaml --global
#
# Credential scope:  OPENAI_API_KEY, sent as a bearer authorization header to
#                    api.openai.com and nowhere else. The sandbox only sees a
#                    placeholder; the gateway proxy puts the real key on the request.
# Endpoint access:   api.openai.com, read-write, L7 enforced.

id: openai
display_name: OpenAI
description: OpenAI inference API
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: OpenAI API key
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.openai.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/local/bin/python3.12]
