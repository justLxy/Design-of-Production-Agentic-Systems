[scan]
paths = ["testcode/BenchmarkTest000*.py"]
exclude = []
min_severity = "MEDIUM"
bandit_version = "1.9.4"

[model]
provider = "openai"
name = "gpt-6-luna"
reasoning_effort = "low"

[budget]
max_tokens = 1500000
output_allowance = 4000
max_steps = 800

[agent]
kind = "codeact"

[mcp]
config = "mcp.json"

[sandbox]
policy = "policy.yaml"

[target]
# The sandbox hides .git, so the pinned commit comes from here (report.json target.commit).
commit = "f1291485808b66e20ddb6b01b10dc71b3df8c8ba"
